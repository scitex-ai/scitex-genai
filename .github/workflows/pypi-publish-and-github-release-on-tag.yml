name: release

# Tag-driven release pipeline — SELF-HOSTED (Spartan CPU) via the scitex-ci SIF.
#
# The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest INSIDE the SIF. Must pass or the pipeline
#                      halts; nothing is published until tests are green on the
#                      tagged commit.
#   2. build         — wheel + sdist built INSIDE the SIF, uploaded as artifact.
#   3. publish       — PyPI via MANUAL OIDC trusted publishing INSIDE the SIF.
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#
# develop→main promotion is a DELIBERATE, separate PR (operator policy);
# this pipeline never auto-syncs main.
#
# WHY the SIF (operator standardization 2026-06-18, fleet canary 2026-06-21):
# the Spartan compute runners have NO Python on the bare node, so the old
# `actions/setup-python@v5` step failed at init ("version 3.x not found for
# this OS"). The working pytest-matrix CI runs INSIDE the pre-built, reused
# scitex-ci SIF (`apptainer exec ci-cpu.sif`), which bakes python 3.11/3.12/
# 3.13 + pip + uv + fd at /opt/venv-<ver>. This release pipeline mirrors that:
#   - test/build run `bash .github/ci/exec-in-sif.sh <inner>.sh <pyver>`.
#   - publish CANNOT use pypa/gh-action-pypi-publish (a Docker action; the
#     compute nodes have no Docker), so it does MANUAL OIDC trusted publishing
#     inside the SIF (.github/ci/publish-in-sif.sh): GitHub OIDC JWT →
#     PyPI mint-token → twine upload. Trust config on PyPI is unchanged.
#   - actions/checkout, upload/download-artifact, codecov are JS actions and
#     run fine on the self-hosted runner.
# fail-loud: a missing SIF/shim/interpreter is a HARD error, never a
# bare-runner fallback.
#
# runs-on driven by repo Actions Variable CI_RUNS_ON; SIF + apptainer paths
# come from SCITEX_CI_SIF / SCITEX_CI_APPTAINER (same as pytest-matrix).
#
# Manual re-run: the workflow also accepts a `version` input via
# workflow_dispatch so you can re-publish without re-tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

env:
  SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}
  SCITEX_CI_SIF: ${{ vars.SCITEX_CI_SIF }}

jobs:
  runner-admission:
    uses: scitex-ai/.github/.github/workflows/runner-admission.yml@d7d96c34d68cdfbb5503a933591f7748b5aa30ee
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-ci"]'

  pin:
    # Resolve the tag to its immutable peeled commit ONCE. test/build/publish
    # all check out this commit (never a moving tag), so the pinned source is
    # literally identical everywhere downstream.
    needs: runner-admission
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Resolve version to immutable commit
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then v="${REF#refs/tags/}"; else v="$INPUT_VERSION"; fi
          case "$v" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version must be an existing vX.Y.Z tag (got '$v')"; exit 1;;
          esac
          case "$v" in *[/$'\n\r '*]*|*..*) echo "::error::version contains path/branch characters"; exit 1;; esac
          REPO="https://github.com/${{ github.repository }}"
          SHA="$(git ls-remote "$REPO" "refs/tags/$v^{}" | cut -f1)"
          if [ -z "$SHA" ]; then SHA="$(git ls-remote "$REPO" "refs/tags/$v" | cut -f1)"; fi
          test -n "$SHA" || { echo "::error::tag refs/tags/$v not found on origin"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "pinned $v -> $SHA"

  test:
    needs: [pin, runner-admission]
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Organization admission gate: no test/build/publish work runs unless the
      # admitted runner vouches membership. The expected JSON is derived from
      # the central runner-admission source (native self-hosted request with a
      # declared pool label yields group Organization plus the requested labels).
      - name: Require confirmed organization admission
        env:
          NATIVE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
          ADMISSION_REASON: ${{ needs.runner-admission.outputs.reason }}
          ADMISSION_RUNS_ON: ${{ needs.runner-admission.outputs.runs_on }}
        run: |
          set -euo pipefail
          test "$NATIVE_AUTHORIZED" = true
          test "$ADMISSION_REASON" = confirmed-organization-members
          test "$ADMISSION_RUNS_ON" = '{"group":"Organization","labels":["self-hosted","Linux","X64","scitex-ci"]}'
          echo "admission: $ADMISSION_REASON runs_on=$ADMISSION_RUNS_ON"
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.pin.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.pin.outputs.commit }}"
      # SIF-based self-hosted test run — mirrors pytest-matrix exactly. No
      # setup-python (the bare Spartan node has no Python tool cache; that step
      # failed "version not found for this OS"); no apt fd-install (fd is baked
      # in the SIF). exec-in-sif.sh apptainer-execs the reused ci-cpu.sif and
      # run-in-sif.sh layers THIS (tagged) checkout + [all,dev] into a writable
      # target, then runs pytest. fail-loud on a missing SIF/shim.
      - name: Run tests in the reused CI SIF (apptainer exec — deps layered, not on the bare runner)
        run: bash .github/ci/exec-in-sif.sh run-in-sif.sh ${{ matrix.python-version }}
      - name: Remove owned test scratch on this runner
        if: always()
        run: |
          rm -rf "/tmp/ci-scitex_genai-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.python-version }}"

  build:
    needs: [pin, test, runner-admission]
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    outputs:
      version: ${{ needs.pin.outputs.version }}
      commit: ${{ needs.pin.outputs.commit }}
      dist_sha256: ${{ steps.hash.outputs.dist_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.pin.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.pin.outputs.commit }}"
      # Build INSIDE the SIF (no setup-python on the bare Spartan node).
      # build-in-sif.sh installs the `build` frontend into a writable --target
      # inside the SIF, then `python -m build` → dist/. fail-loud on empty dist.
      - name: Build wheel + sdist in the CI SIF (apptainer exec)
        run: bash .github/ci/exec-in-sif.sh build-in-sif.sh 3.12
      - name: Record dist hashes for publish provenance
        id: hash
        run: |
          set -euo pipefail
          test -n "$(ls -A dist 2>/dev/null)" || { echo "::error::dist/ empty after build"; exit 1; }
          {
            echo 'dist_sha256<<EOF'
            (cd dist && sha256sum ./* | sort)
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      # upload-artifact is a JS action — runs fine on the self-hosted runner.
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
      - name: Remove owned build scratch on this runner
        if: always()
        run: |
          rm -rf "/tmp/build-scitex_genai-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-3.12"

  publish:
    needs: [build, runner-admission]
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-genai
    # id-token: write is what populates ACTIONS_ID_TOKEN_REQUEST_{TOKEN,URL},
    # which publish-in-sif.sh uses to mint the OIDC JWT. Keep it.
    permissions:
      id-token: write
    steps:
      # Need the repo checked out so .github/ci/exec-in-sif.sh +
      # publish-in-sif.sh are on disk (the build job uploaded only dist/).
      # Explicit tag checkout: the tag — not a branch head — is the immutable source.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      # Immutable tag/commit/source+artifact qualification BEFORE token mint.
      # The artifacts are downloaded first, then proven: wheel/sdist METADATA
      # name+version, filename version, and sha256 equality against the hashes
      # recorded at build from the immutable commit. No OIDC JWT is requested
      # until every assertion below holds.
      - name: Qualify immutable tag, commit, version and artifacts
        env:
          TAG: ${{ needs.build.outputs.version }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
          BUILD_HASHES: ${{ needs.build.outputs.dist_sha256 }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          HEAD="$(git rev-parse HEAD)"
          test "$HEAD" = "$BUILD_COMMIT" || { echo "::error::checkout $HEAD != build commit $BUILD_COMMIT"; exit 1; }
          test "$HEAD" = "$(git rev-list -n 1 "$TAG")" || { echo "::error::checkout not the tag peeled commit"; exit 1; }
          VER="${TAG#v}"
          PYVER="$(grep -m1 '^version = ' pyproject.toml | sed 's/.*"\([^"]*\)".*/\1/')"
          test "$VER" = "$PYVER" || { echo "::error::tag $TAG != pyproject $PYVER"; exit 1; }
          test -n "$(ls -A dist 2>/dev/null)" || { echo "::error::dist/ empty before mint"; exit 1; }
          for f in dist/*; do case "$f" in *"$VER"*) ;; *) echo "::error::artifact $f lacks version $VER"; exit 1;; esac; done
          GOT="$(cd dist && sha256sum ./* | sort)"
          test "$GOT" = "$BUILD_HASHES" || { echo "::error::downloaded dist hashes differ from build record"; echo "$GOT"; exit 1; }
          bash .github/ci/exec-in-sif.sh qualify-dist.sh 3.12 "$VER" || {
            echo "::error::wheel/sdist METADATA name/version mismatch for $VER"; exit 1; }
          echo "qualified tag=$TAG commit=$HEAD version=$VER"
      # Manual OIDC trusted publishing INSIDE the SIF — pypa/gh-action-pypi-
      # publish is a Docker action and the Spartan compute nodes have no Docker.
      # publish-in-sif.sh: GitHub OIDC JWT (audience=pypi) → PyPI mint-token →
      # twine upload dist/*. apptainer exec (no --cleanenv) passes the
      # ACTIONS_ID_TOKEN_REQUEST_* env vars into the SIF. fail-loud at each step.
      - name: Publish to PyPI via manual OIDC trusted publishing in the SIF
        run: bash .github/ci/exec-in-sif.sh publish-in-sif.sh 3.12
      - name: Remove owned publish scratch on this runner
        if: always()
        run: |
          rm -rf "/tmp/publish-scitex_genai-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-3.12"

  release:
    needs: [build, publish, runner-admission]
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build.outputs.version }}" \
            --title "${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*
      - name: Remove owned release scratch on this runner
        if: always()
        run: |
          rm -rf release-notes.md dist
