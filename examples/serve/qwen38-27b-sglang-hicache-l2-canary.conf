# --hicache-size is decimal GB per TP rank, not a job-wide total. For TP=2,
# this profile asks for up to 64 GB across both ranks. The hybrid model divides
# each rank's allocation between ordinary KV pages and Mamba/GDN state.
EXTRA_SGLANG_ARGS="--trust-remote-code --kv-cache-dtype fp8_e4m3 --attention-backend flashinfer --chunked-prefill-size 32768 --max-prefill-tokens 32768 --disable-prefill-cuda-graph --reasoning-parser qwen3 --tool-call-parser qwen3_coder --enable-metrics --json-model-override-args '{\"text_config\":{\"rope_parameters\":{\"mrope_interleaved\":true,\"mrope_section\":[11,11,10],\"rope_type\":\"yarn\",\"rope_theta\":10000000,\"partial_rotary_factor\":0.25,\"factor\":4.0,\"original_max_position_embeddings\":262144}}}' --speculative-algorithm EAGLE --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens 4 --enable-hierarchical-cache --hicache-size 32 --hicache-io-backend kernel --hicache-mem-layout page_first --hicache-write-policy write_through"
