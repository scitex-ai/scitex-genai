#   sha256:b742f112f8403417c781216e9d4cf9d7eff49f2d6127e682805c40225a74cab2
# Pinned model manifest:
#   sha256:ae63fb8baffb044e4d0ee476a03283de640690e50fe3282c95996d9dc016a01c
# Measured max_total_num_tokens: 572149; gateway token_capacity: 250000.
ENGINE=sglang
SGLANG_IMAGE=/data/scratch/projects/punim0264/ywatanabe/containers/sglang-qwen38-cu12-amd64-45e39d4c5bcf.sif
MODEL_PATH=/data/scratch/projects/punim0264/ywatanabe/hf/Qwen3.8-27B-FP8
SERVED_NAME=qwen38-27b
