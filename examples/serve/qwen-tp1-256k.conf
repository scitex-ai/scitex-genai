EXTRA_SGLANG_ARGS="--trust-remote-code --kv-cache-dtype fp8_e4m3 --attention-backend flashinfer --schedule-policy lpm --chunked-prefill-size 8192 --max-prefill-tokens 32768 --disable-prefill-cuda-graph --reasoning-parser qwen3 --tool-call-parser qwen3_coder --enable-metrics --enable-cache-report --json-model-override-args '{\"text_config\":{\"rope_parameters\":{\"mrope_interleaved\":true,\"mrope_section\":[11,11,10],\"rope_type\":\"yarn\",\"rope_theta\":10000000,\"partial_rotary_factor\":0.25,\"factor\":4.0,\"original_max_position_embeddings\":262144}}}' --speculative-algorithm EAGLE --speculative-num-steps 3 --speculative-eagle-topk 1 --speculative-num-draft-tokens 4"
